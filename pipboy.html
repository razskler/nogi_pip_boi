<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pip-Boy 3000</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0e0a;
            color: #00ff41;
            height: 100vh;
            overflow: hidden;
        }

        /* Scanline effect */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 9999;
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 16px;
            padding: 16px;
        }

        /* Left panel - character status */
        .left-panel {
            width: 220px;
            border: 2px solid #00ff41;
            background: rgba(0, 20, 0, 0.6);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.25);
        }

        .status-block {
            border-bottom: 1px dashed #00aa00;
            padding-bottom: 14px;
        }

        .status-block:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .status-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00aa00;
            margin-bottom: 6px;
        }

        .status-value {
            font-size: 16px;
            font-weight: bold;
        }

        .name-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #00aa00;
            color: #00ff41;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            padding: 2px 0;
        }

        .name-input:focus {
            outline: none;
            border-bottom-color: #00ff41;
        }

        .health-bar {
            background: rgba(0, 20, 0, 0.5);
            border: 1px solid #00ff41;
            height: 10px;
            margin-top: 6px;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff41, #00aa00);
            width: 100%;
            transition: width 0.3s ease;
        }

        .small-btn {
            background: rgba(0, 40, 0, 0.8);
            color: #00ff41;
            border: 1px solid #00ff41;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            border-radius: 2px;
        }

        .small-btn:hover {
            background: rgba(0, 70, 0, 1);
        }

        /* Main panel */
        .main-panel {
            flex: 1;
            border: 2px solid #00ff41;
            background: rgba(0, 20, 0, 0.6);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.25);
            overflow: hidden;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #00ff41;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #00aa00;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-right: 1px solid #00ff41;
            background: rgba(0, 20, 0, 0.4);
        }

        .tab:last-child {
            border-right: none;
        }

        .tab:hover {
            background: rgba(0, 40, 0, 0.8);
            color: #00ff41;
        }

        .tab.active {
            background: rgba(0, 50, 0, 1);
            color: #00ff41;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.4) inset;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: none;
        }

        .content.active {
            display: block;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00aa00;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #00ff41;
        }

        /* SPECIAL stat rows with +/- controls */
        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dotted rgba(0, 255, 65, 0.25);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-name {
            font-size: 14px;
            color: #00ff41;
            letter-spacing: 1px;
        }

        .stat-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        /* Items */
        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dotted rgba(0, 255, 65, 0.25);
            font-size: 14px;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-name {
            color: #00ff41;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-qty {
            min-width: 18px;
            text-align: center;
            font-weight: bold;
        }

        .remove-btn {
            background: transparent;
            color: #ff3300;
            border: 1px solid #ff3300;
            width: 22px;
            height: 22px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 2px;
            line-height: 1;
        }

        .remove-btn:hover {
            background: rgba(255, 51, 0, 0.2);
        }

        .add-item-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .add-item-row input {
            flex: 1;
            background: rgba(0, 20, 0, 0.5);
            border: 1px solid #00aa00;
            color: #00ff41;
            font-family: inherit;
            padding: 8px;
            font-size: 13px;
        }

        .add-item-row input:focus {
            outline: none;
            border-color: #00ff41;
        }

        button.action {
            background: rgba(0, 40, 0, 0.8);
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            text-transform: uppercase;
            border-radius: 2px;
        }

        button.action:hover {
            background: rgba(0, 70, 0, 1);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.4);
        }

        .empty-msg {
            color: #00aa00;
            font-size: 13px;
            font-style: italic;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 20, 0, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 4px;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }
            .left-panel {
                width: 100%;
                order: 2;
            }
            .main-panel {
                order: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="status-block">
                <div class="status-label">Vault Dweller</div>
                <input class="name-input" id="charName" value="Vault Dweller" maxlength="24">
            </div>

            <div class="status-block">
                <div class="status-label">Level</div>
                <div class="stat-controls">
                    <button class="small-btn" onclick="changeLevel(-1)">-</button>
                    <span class="status-value" id="charLevel">1</span>
                    <button class="small-btn" onclick="changeLevel(1)">+</button>
                </div>
            </div>

            <div class="status-block">
                <div class="status-label">Health</div>
                <div class="health-bar">
                    <div class="health-fill" id="healthFill" style="width: 100%"></div>
                </div>
                <div class="stat-controls" style="margin-top: 8px; justify-content: space-between;">
                    <button class="small-btn" onclick="changeHealth(-10)">-</button>
                    <span class="status-value" id="healthText">100</span>
                    <button class="small-btn" onclick="changeHealth(10)">+</button>
                </div>
            </div>
        </div>

        <!-- MAIN PANEL -->
        <div class="main-panel">
            <div class="tabs">
                <div class="tab active" data-tab="stats">Stats</div>
                <div class="tab" data-tab="items">Items</div>
            </div>

            <!-- STATS TAB -->
            <div class="content active" id="stats">
                <div class="section-title">S.P.E.C.I.A.L.</div>
                <div id="specialStats"></div>
            </div>

            <!-- ITEMS TAB -->
            <div class="content" id="items">
                <div class="section-title">Inventory</div>
                <div id="itemList"></div>

                <div class="add-item-row">
                    <input type="text" id="newItemName" placeholder="Item name..." maxlength="30">
                    <button class="action" onclick="addItem()">Add</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ====================================================================
        // State (lives only in this page - no server, no persistence)
        // ====================================================================

        const state = {
            level: 1,
            health: 100,
            special: {
                strength: 5,
                perception: 5,
                endurance: 5,
                charisma: 5,
                intelligence: 5,
                agility: 5,
                luck: 5,
            },
            items: [
                { name: "10mm Pistol", qty: 1 },
                { name: "10mm Rounds", qty: 45 },
                { name: "Stimpak", qty: 5 },
                { name: "Rad-Away", qty: 2 },
            ],
        };

        // ====================================================================
        // Render
        // ====================================================================

        function render() {
            document.getElementById('charLevel').textContent = state.level;
            document.getElementById('healthText').textContent = state.health;
            document.getElementById('healthFill').style.width = state.health + '%';
            renderStats();
            renderItems();
        }

        function renderStats() {
            const html = Object.entries(state.special).map(([key, value]) => `
                <div class="stat-row">
                    <span class="stat-name">${key.toUpperCase()}</span>
                    <div class="stat-controls">
                        <button class="small-btn" onclick="changeStat('${key}', -1)">-</button>
                        <span class="stat-value">${value}</span>
                        <button class="small-btn" onclick="changeStat('${key}', 1)">+</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('specialStats').innerHTML = html;
        }

        function renderItems() {
            if (state.items.length === 0) {
                document.getElementById('itemList').innerHTML = '<p class="empty-msg">No items. Add something below.</p>';
                return;
            }
            const html = state.items.map((item, i) => `
                <div class="item-row">
                    <span class="item-name">${item.name}</span>
                    <div class="item-controls">
                        <button class="small-btn" onclick="changeItemQty(${i}, -1)">-</button>
                        <span class="item-qty">${item.qty}</span>
                        <button class="small-btn" onclick="changeItemQty(${i}, 1)">+</button>
                        <button class="remove-btn" onclick="removeItem(${i})">✕</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('itemList').innerHTML = html;
        }

        // ====================================================================
        // Actions
        // ====================================================================

        function changeLevel(delta) {
            state.level = Math.max(1, state.level + delta);
            render();
        }

        function changeHealth(delta) {
            state.health = Math.max(0, Math.min(100, state.health + delta));
            render();
        }

        function changeStat(key, delta) {
            state.special[key] = Math.max(1, Math.min(10, state.special[key] + delta));
            render();
        }

        function changeItemQty(index, delta) {
            state.items[index].qty += delta;
            if (state.items[index].qty <= 0) {
                state.items.splice(index, 1);
            }
            render();
        }

        function removeItem(index) {
            state.items.splice(index, 1);
            render();
        }

        function addItem() {
            const input = document.getElementById('newItemName');
            const name = input.value.trim();
            if (!name) return;

            const existing = state.items.find(i => i.name.toLowerCase() === name.toLowerCase());
            if (existing) {
                existing.qty += 1;
            } else {
                state.items.push({ name, qty: 1 });
            }
            input.value = '';
            render();
        }

        document.getElementById('newItemName').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addItem();
        });

        // ====================================================================
        // Tabs
        // ====================================================================

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        // ====================================================================
        // Init
        // ====================================================================

        render();
    </script>
</body>
</html>
